# ===== Group Channel: all channels (CSU + BF/DIC + DMD) =====
# napari-micromanager runs an MDA on one channel group only, so every channel is here.
# Every preset sets the same 9 properties (napari-micromanager drops properties that the
# first preset does not set). Fluorescence: LaserShutter (NI-DAQ TTL -> mechanical shutter
# after the always-on laser), State = TTL line bit. Transmitted: DiaShutter, halogen at one
# brightness per experiment (TransmittedIllumination 2, Brightness); epi presets close DiaShutter.
# Olympus mirror turrets: open for CSU imaging; Dichroic 1 = forDMD_Blue for the DMD presets.
