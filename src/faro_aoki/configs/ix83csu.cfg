# Configuration presets

# ===== System Startup =====
# Laser shutter: the State Device Shutter switches the NI-DAQ TTL lines that drive the
# mechanical shutters after the lasers (100 ms delay, see Delay,LaserShutter).
ConfigGroup,System,Startup,LaserShutter,State Device,NIDAQDO-Dev2/port1
# Spinning disk on at startup (CSU group: Brightfield stops it, Confocal starts it).
ConfigGroup,System,Startup,CSUW1-Drive Speed,Run,On
# Olympus mirror turrets: excitation dichroic and emission filter are in the CSU, but the
# turrets sit in the CSU light path (objective <-> side port), so keep both on an open slot.
ConfigGroup,System,Startup,Dichroic 1,Label,1-Open
ConfigGroup,System,Startup,Dichroic 2,Label,1-Open
# Halogen (DIA2) dark at startup: the IX83 adapter has no lamp on/off, only Brightness 0-255.
# Set one brightness per experiment and keep it; BF and DIC differ by exposure time.
# Epi presets close DiaShutter, DIC/BF presets open it (as in IX83Lumencor2.cfg).
ConfigGroup,System,Startup,DiaShutter,State,0
ConfigGroup,System,Startup,TransmittedIllumination 2,Brightness,0
# CSU shutter is slow (100 ms in MetaMorph): keep it open, the TTL laser shutters are the exposure shutter.
ConfigGroup,System,Startup,CSUW1-Shutter,State,Open
ConfigGroup,System,Startup,Core,Shutter,LaserShutter
ConfigGroup,System,Startup,Camera,ScanMode,1

ConfigGroup,Binning,1x1,Camera,Binning,1x1
ConfigGroup,Binning,2x2,Camera,Binning,2x2
ConfigGroup,Binning,4x4,Camera,Binning,4x4

